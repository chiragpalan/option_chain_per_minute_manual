name: Fetch NSE Option Chain

on:
  workflow_dispatch: 

jobs:
  run-script:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Playwright System Browsers
      run: npx playwright install chromium --with-deps

    - name: Run browser automation script
      run: python fetch_data.py

    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@://github.com"
        git add README.md
        git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update live option chain table" && git push)
