name: Fetch NSE Option Chain

on:
  workflow_dispatch: # Enables the manual "Run workflow" trigger button on GitHub

jobs:
  run-script:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Crucial flag giving Github Action permission to commit back to your repository

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run data fetching script
      run: python fetch_data.py

    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@://github.com"
        git add README.md
        # Only commit and push if the README actually changed to avoid build loops
        git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update live option chain table" && git push)
